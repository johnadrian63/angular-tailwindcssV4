<h2 class="text-center font-bold my-3">Grid Flow</h2>

<h2>Grid Rows + Grid Flow Column</h2>
<pre class="p-2 border my-1">
grid grid-rows-3 grid-flow-col
</pre>

<div class="grid grid-rows-3 grid-flow-col gap-4 border-4 border-green-500 mb-4">
    @for (item of getRange(7); track $index) {
        <div class="border-4 border-blue-600 p-4">Card {{ $index }}</div>
    }
</div>
<h2>Grid Columns + Grid Flow Row</h2>
<pre class="p-2 border my-1">
grid grid-cols-5 grid-flow-row
</pre>

<div class="grid grid-cols-3 grid-flow-row gap-4 border-4 border-green-500 mb-4">
    @for (item of getRange(5); track $index) {
        <div class="border-4 border-blue-600 p-4">Card {{ $index }}</div>
    }
</div>
