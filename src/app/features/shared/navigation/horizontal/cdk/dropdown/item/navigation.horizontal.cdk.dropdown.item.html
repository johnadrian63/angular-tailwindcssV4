<ng-template #menuItem>
    <div class="dropdown-menu" [ngClass]="menuClass" cdkMenu>
        @for (item of menu().children; track item.label) {
            @if (item.children?.length) {
                <div
                    class="dropdown-menu-item"
                    [cdkMenuTriggerFor]="dropdown.menuItem()!"
                    cdkMenuItem
                >
                    <app-navigation-horizontal-cdk-dropdown-resolver
                        [menu]="item"
                    ></app-navigation-horizontal-cdk-dropdown-resolver>
                </div>
                <app-navigation-horizontal-cdk-dropdown-item
                    #dropdown
                    [menu]="item"
                    [classes]="classes"
                ></app-navigation-horizontal-cdk-dropdown-item>
            } @else {
                <div class="dropdown-menu-item" cdkMenuItem>
                    <app-navigation-horizontal-cdk-dropdown-resolver
                        [menu]="item"
                    ></app-navigation-horizontal-cdk-dropdown-resolver>
                </div>
            }
        }
    </div>
</ng-template>
