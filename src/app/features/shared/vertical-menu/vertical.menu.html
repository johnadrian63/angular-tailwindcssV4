@if (selectedMenus().length > 1) {
    <div class="back" (click)="back()">
        <fa-icon [icon]="faAngleLeftIcon"></fa-icon>
        <span>{{ currentMenu.parent?.text }}</span>
    </div>
}
<ul
    class="vertical-menu transition-opacity duration-300 ease-in-out"
    [class.opacity-0]="!isVisible()"
    [class.opacity-100]="isVisible()"
>
    @for (menu of currentMenu.children; track menu.label) {
        <li class="vertical-menu-item">
            @if (menu.children?.length) {
                <span (click)="expand(menu, menu.children)">
                    {{ menu.text }}
                    <fa-icon class="ml-auto" [icon]="faAngleRightIcon"></fa-icon>
                </span>
            } @else {
                <a routerLink="bottom-sheet" [relativeTo]="activatedRoute.parent">
                    {{ menu.text }}
                </a>
            }
        </li>
    }
</ul>
