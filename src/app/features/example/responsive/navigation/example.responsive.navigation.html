<header class="flex items-center p-2 fixed bottom-0 w-full border-neutral-200 shadow-lg">
    <div class="mr-2">
        <a routerLink="responsive" [relativeTo]="activatedRoute.parent" class="mr-2">Logo</a>
        <fa-icon
            (click)="toggle()"
            [icon]="faTableColumnsIcon"
            class="sidebar-toggle cursor-pointer"
        ></fa-icon>
    </div>
    <nav>
        <app-example-responsive-navigation-horizontal-menu></app-example-responsive-navigation-horizontal-menu>
    </nav>

    <div class="ml-auto flex relative z-40">
        <fa-icon (click)="openMenu()" [icon]="faBarsIcon" class="menu-toggle mr-2"></fa-icon>
        <fa-icon (click)="openProfile()" class="profile-icon mobile" [icon]="faUserIcon"></fa-icon>
        <app-example-responsive-navigation-horizontal-profile></app-example-responsive-navigation-horizontal-profile>
    </div>
</header>
