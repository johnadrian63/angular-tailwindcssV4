<h2 class="text-center font-bold my-3">Basic</h2>

<button
    (click)="showTemplate1()"
    class="border border-gray-100 shadow px-3 py-2 cursor-pointer hover:bg-gray-300 rounded-lg mr-1"
>
    Show Template 1
</button>
<button
    (click)="showTemplate2()"
    class="border border-gray-100 shadow px-3 py-2 cursor-pointer hover:bg-gray-300 rounded-lg"
>
    Show Template 2
</button>

<h3 class="mt-2">Template will be shown here:</h3>

<div class="border border-gray-300 p-2 mt-2">
    <ng-template #template></ng-template>
</div>
