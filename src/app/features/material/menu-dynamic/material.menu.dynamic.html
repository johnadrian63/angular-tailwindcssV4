<h2 class="text-center font-bold my-3">Dynamic Menu</h2>
@for (menu of menuList(); track menu.label) {
    @if (menu.children?.length) {
        <button matButton [matMenuTriggerFor]="dropdown.items()!">{{ menu.text }}</button>

        <app-dropdown-menu #dropdown [menus]="menu.children"></app-dropdown-menu>
    } @else {
        <button matButton>{{ menu.text }}</button>
    }
}
