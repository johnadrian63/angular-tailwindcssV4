<h2 class="text-center font-bold my-3">Dynamic Menu</h2>

<button matButton [matMenuTriggerFor]="animals">Animals</button>
<mat-menu #animals="matMenu">
    <button mat-menu-item [matMenuTriggerFor]="sea">Sea</button>
    <button mat-menu-item>Land</button>
</mat-menu>
<mat-menu #sea="matMenu">
    <button mat-menu-item>Fish</button>
    <button mat-menu-item>Whale</button>
    <button mat-menu-item>Seal</button>
</mat-menu>

<button matButton [matMenuTriggerFor]="animals">Vehicles</button>
<mat-menu #animals="matMenu">
    <button mat-menu-item>Car</button>
    <button mat-menu-item [matMenuTriggerFor]="motorcycle">Motorcycle</button>
</mat-menu>
<mat-menu #motorcycle="matMenu">
    <button mat-menu-item>KTM</button>
    <button mat-menu-item>Yamaha</button>
    <button mat-menu-item>Honda</button>
</mat-menu>
